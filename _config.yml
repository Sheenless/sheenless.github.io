# Site settings
title:          Matt Heaton
tagline:        'Agricultural Development · Sustainability · Data Visualisation'
description:    'Research Fellow at the University of East Anglia.'
url:            'https://mattheaton.info'
baseurl:        ''

# Author
author:  
  name:         'Matt Heaton'

# Build settings
markdown:       kramdown
highlighter:    rouge
permalink:      pretty

plugins:
  - jekyll-paginate-v2
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-seo-tag

pagination:
  enabled: true
  per_page: 8
  permalink: '/page/:num/'
  sort_field: 'date'
  sort_reverse: true

collections:
  research:
    output: true
    permalink: /research/:name/
  dataviz:
    output: true
    permalink: /dataviz/:name/
  visual:
    output: true
    permalink: /visual/:name/
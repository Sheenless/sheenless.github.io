---
layout: default
---

<!-- Used by _dataviz/*.md items. Same pattern as post.html/visual-item.html
     (Cloudinary transform on the front-matter image, .post-content wrapper
     for lightbox scoping - see post.html for comments) but with the image
     placed after the title/meta rather than before it. -->
<article class="dataviz-item">
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}
    <p class="post-subtitle">{{ page.subtitle }}</p>
  {% endif %}
  <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
 {% if page.image and page.image != "" %}
    <img src="{{ page.image | replace: '/upload/', '/upload/f_auto,q_auto,w_1200/' }}" alt="{{ page.title }}">
 {% endif %}
  <div class="post-content">{{ content }}</div>
</article>

---
layout: default
---

<!-- Used by _visual/*.md items. Deliberately kept as a copy of post.html
     rather than a shared partial, so each collection's template can diverge
     later without affecting the others. See post.html for comments on the
     hero-image transform and the .post-content/lightbox scoping below. -->
<article class="post">
  {% if page.image and page.image != "" %}
    <img src="{{ page.image | replace: '/upload/', '/upload/f_auto,q_auto,w_1200/' }}" alt="{{ page.title }}">
  {% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}
    <p class="post-subtitle">{{ page.subtitle }}</p>
  {% endif %}
  <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
   {% if page.tags %}
      <div class="post-tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
  <div class="post-content">{{ content }}</div>
</article>
